#
# The page's questions, its Apply and its Reset. errors:no on each: the script prints a JSON answer and
# exits 0, and this keeps the answer if one ever does not.

[status]
command:/usr/local/opnsense/scripts/quota/status.py
parameters:
errors:no
type:script_output
message:reading Quotas' counts

# One read now: each quota counted, the cycles, the table of the hosts over their quota.
[account]
command:/usr/local/opnsense/scripts/quota/account.py
parameters:
errors:no
type:script_output
message:counting Quotas from pf's states

# One quota's count of this cycle back to nothing, or every quota's (all); a read follows. The id is
# quoted by configd.
[reset]
command:/usr/local/opnsense/scripts/quota/account.py --reset
parameters:%s
errors:no
type:script_output
message:resetting a quota's count

# The alias quota_over made to say what the settings say, and XGS: Settings' cut list where os-xgs-npu
# is installed. The page's Apply goes on with the filter and a read.
[apply]
command:/usr/local/opnsense/scripts/quota/aliases.php
parameters:
errors:no
type:script_output
message:writing Quotas' alias

# The alias taken out - its removal runs it while its files are still there.
[remove]
command:/usr/local/opnsense/scripts/quota/aliases.php --remove
parameters:
errors:no
type:script_output
message:removing Quotas' alias

# The table emptied and the counting paused: the plugin turned off. What it held is handed back from
# hardware, and a hand-back not done is tried again at the next read.
[flush]
command:/usr/local/opnsense/scripts/quota/account.py --flush
parameters:
errors:no
type:script_output
message:emptying Quotas' table

# The same for the plugin's removal: every hand-back from hardware done there and then - what the table
# held and what was kept to try again - as no read follows it.
[leave]
command:/usr/local/opnsense/scripts/quota/account.py --leave
parameters:
errors:no
type:script_output
message:emptying Quotas' table for its removal

# The table taken out of pf once its alias is gone: a table outlives its alias.
[gone]
command:/usr/local/opnsense/scripts/quota/account.py --gone
parameters:
errors:no
type:script_output
message:taking Quotas' table out of pf
